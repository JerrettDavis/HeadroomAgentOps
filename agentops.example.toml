repo = "headroomlabs-ai/headroom"
state = ".agentops"
harness = "codex"
concurrency = 2
image = "headroom-agentops-worker:local"
# Model selection is optional; omit to use the harness's default.
# model = "your-model"
# Copy only model auth, never inherited tools, MCP configs or GitHub credentials.
# auth_root = "C:/Users/you/.codex"
# Devin uses the credentials.toml written by `devin auth login`; auth_root is
# %APPDATA%/devin on Windows or ~/.local/share/devin on Linux/macOS.
# Publish guarded feedback, reviews, maintainer fixes and screened CI actions.
# Use false (or --no-publish) for an explicitly local-only run. Merging is never allowed.
publish = true
timeout_seconds = 3600
packet_budget = 24576
poll_seconds = 5

# Shared dashboard settings override these initial provider stop points.
# New reviews wait at this percentage used; running reviews finish normally.
[provider_limits.codex]
stop_percent = 80
enabled = true

# token_budget (any provider) enforces a measured weekly consumption cap from
# this ledger's own execution records, bounded by the account's weekly quota
# reset; stop_percent still applies. Required for Devin when the account does
# not report quota windows.
# [provider_limits.devin]
# stop_percent = 25
# token_budget = 100000000
