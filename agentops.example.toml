repo = "headroomlabs-ai/headroom"
state = ".agentops"
harness = "codex"
concurrency = 2
image = "headroom-agentops-worker:local"
# Model selection is optional; omit to use the harness's default.
# model = "your-model"
# Copy only model auth, never inherited tools, MCP configs or GitHub credentials.
# auth_root = "C:/Users/you/.codex"
# Publish guarded feedback, reviews, maintainer fixes and screened CI actions.
# Use false (or --no-publish) for an explicitly local-only run. Merging is never allowed.
publish = true
timeout_seconds = 3600
packet_budget = 24576
poll_seconds = 5
