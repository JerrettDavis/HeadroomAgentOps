version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /worker
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        versions: ["25.x"] # End of life; retain supported Node 24 LTS.
