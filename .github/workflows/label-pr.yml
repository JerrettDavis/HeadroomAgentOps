name: Label PR
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Reads configuration from the trusted base branch through the API.
      # Never check out or execute the pull request's code in this job.
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5
        with:
          sync-labels: true
