name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_environment: ${{ steps.settings.outputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read central release settings
        id: settings
        run: |
          python3 - <<'PY'
          import json, os, re
          name = json.load(open('.github/repository.json'))['release_environment']
          assert re.fullmatch(r'[A-Za-z0-9_.-]+', name), 'Invalid release environment'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('environment=' + name, file=output)
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install . build twine pip-audit bandit
      - run: pip-audit
      - run: bandit -r agentops worker/entry.py -lll
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm audit --omit=dev --audit-level=high
        working-directory: worker
      - run: python -m unittest discover -s tests -v
      - run: docker build -f worker/Dockerfile -t headroom-agentops-worker:local .
      - run: python -m unittest discover -s tests -p test_docker.py -v
        env:
          AGENTOPS_DOCKER_TESTS: '1'
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: python -c "import os,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['GITHUB_REF_NAME'] == 'v'+v, 'Tag must match project version'"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Archive tested worker image
        run: docker save headroom-agentops-worker:local -o worker-image.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-worker
          path: worker-image.tar
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-package
          path: dist/*
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: qualify
    environment: ${{ needs.qualify.outputs.release_environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-package
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-worker
          path: worker-image
      - name: Publish worker image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/worker:${GITHUB_REF_NAME}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker load -i worker-image/worker-image.tar
          docker tag headroom-agentops-worker:local "$image"
          docker push "$image"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
