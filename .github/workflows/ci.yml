name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - name: Create incidental files to verify release allowlist
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('worker/node_modules/fixture/package.json', 'worker/local-auth-fixture.json',
                       'scripts/internal-fixture.py', 'docs/internal-fixture.md'):
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text('synthetic fixture: must not ship')
          PY
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify usable source package and private-data exclusion
        run: |
          python - <<'PY'
          import pathlib, tarfile
          archive = next(pathlib.Path('dist').glob('*.tar.gz'))
          with tarfile.open(archive) as source:
              names = {'/'.join(item.name.split('/')[1:]) for item in source.getmembers()}
          required = {'worker/Dockerfile', 'worker/package-lock.json', 'worker/entry.py',
                      'scripts/prepare_release.py', 'scripts/configure_repository.py',
                      '.github/repository.json', 'agentops.example.toml', 'agentops/panel.html'}
          assert required <= names, 'Missing source package support files: ' + str(required - names)
          assert not any(name.startswith(('.agentops/', '.remember/', '.serena/', 'docs/superpowers/')) for name in names)
          assert 'agentops.toml' not in names and 'docs/validation.md' not in names
          assert not any('/node_modules/' in name for name in names)
          assert not names.intersection({'worker/local-auth-fixture.json', 'scripts/internal-fixture.py', 'docs/internal-fixture.md'})
          PY
      - run: python -m pip install dist/*.whl
      - run: headroom-review --help
        working-directory: ${{ runner.temp }}
      - run: python -m pip install --force-reinstall dist/*.tar.gz
      - run: headroom-review --help
        working-directory: ${{ runner.temp }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: dist/*
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: docker build --build-arg SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --build-arg SOURCE_REVISION="$GITHUB_SHA" -f worker/Dockerfile -t headroom-agentops-worker:local .
      - run: python -m unittest discover -s tests -p test_docker.py -v
        env:
          AGENTOPS_DOCKER_TESTS: '1'
