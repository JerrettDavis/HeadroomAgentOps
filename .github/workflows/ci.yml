name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[benchmark-test]'
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest tests -q -k benchmark
  benchmark-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install '.[benchmark-test]' -r benchmarks/interop-requirements.txt
      - name: Verify real Inspect SDK and AIPerf loader interoperability
        run: python -m pytest tests/test_benchmark_interop.py -q
  benchmark-transports:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install '.[benchmark-test]'
      - run: docker build -f benchmarks/Dockerfile -t headroom-benchmark:validation .
      - run: docker build -f tests/fixtures/benchmark-ssh.Dockerfile -t headroom-benchmark-ssh:validation .
      - run: python -m pytest tests/test_benchmark_docker.py tests/test_benchmark_ssh.py -q
        env:
          HEADROOM_BENCH_DOCKER_IMAGE: headroom-benchmark:validation
          HEADROOM_BENCH_SSH_IMAGE: headroom-benchmark-ssh:validation
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tests/ui
      - run: npx playwright install --with-deps chromium
        working-directory: tests/ui
      - run: npm test
        working-directory: tests/ui
      - run: npm audit --audit-level=high
        working-directory: tests/ui
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - name: Create incidental files to verify release allowlist
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('worker/node_modules/fixture/package.json', 'worker/local-auth-fixture.json',
                       'scripts/internal-fixture.py', 'docs/internal-fixture.md', 'benchmarks/internal-fixture.json'):
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text('synthetic fixture: must not ship')
          PY
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify usable source package and private-data exclusion
        run: |
          python - <<'PY'
          import pathlib, tarfile
          archive = next(pathlib.Path('dist').glob('*.tar.gz'))
          with tarfile.open(archive) as source:
              names = {'/'.join(item.name.split('/')[1:]) for item in source.getmembers()}
          required = {'worker/Dockerfile', 'worker/package-lock.json', 'worker/entry.py',
                      'scripts/prepare_release.py', 'scripts/configure_repository.py',
                      '.github/repository.json', 'agentops.example.toml', 'agentops/panel.html'}
          assert required <= names, 'Missing source package support files: ' + str(required - names)
          assert not any(name.startswith(('.agentops/', '.remember/', '.serena/', 'docs/superpowers/')) for name in names)
          assert 'agentops.toml' not in names and 'docs/validation.md' not in names
          assert not any('/node_modules/' in name for name in names)
          assert not names.intersection({'worker/local-auth-fixture.json', 'scripts/internal-fixture.py', 'docs/internal-fixture.md', 'benchmarks/internal-fixture.json'})
          PY
      - run: python -m pip install dist/*.whl
      - run: headroom-review --help
        working-directory: ${{ runner.temp }}
      - run: python -m pip install --force-reinstall dist/*.tar.gz
      - run: headroom-review --help
        working-directory: ${{ runner.temp }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: dist/*
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: docker build --build-arg SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --build-arg SOURCE_REVISION="$GITHUB_SHA" -f worker/Dockerfile -t headroom-agentops-worker:local .
      - run: python -m unittest discover -s tests -p test_docker.py -v
        env:
          AGENTOPS_DOCKER_TESTS: '1'
