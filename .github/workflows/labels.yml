name: Sync labels
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const labels = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            for (const label of labels) {
              const args = {...context.repo, ...label};
              try {
                await github.rest.issues.getLabel({...context.repo, name: label.name});
                await github.rest.issues.updateLabel(args);
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel(args);
              }
            }
