[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "headroom-agentops"
version = "0.1.0"
description = "Bounded, single-PR agent review coordination"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
benchmark-test = ["pytest==9.2.0", "jsonschema==4.26.0"]

[project.scripts]
headroom-review = "agentops.cli:main"
headroom-benchmark = "agentops.benchmarks.cli:main"

[tool.setuptools.packages.find]
include = ["agentops*"]

[tool.setuptools.package-data]
agentops = ["panel.html", "tray.ps1", "brand/*.svg", "brand/*.ico", "brand/*.png", "ui/*.js", "ui/*.css", "ui/*.txt", "ui/*.md", "benchmarks/contracts/*.json", "benchmarks/contracts/LICENSE", "benchmarks/contracts/SOURCE.md"]
